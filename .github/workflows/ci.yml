name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  quality-gate:
    name: cs + stan + test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          # composer.json declares "php": ">=8.3", but composer.lock's dev
          # dependencies (friendsofphp/php-cs-fixer -> symfony/*) are locked
          # to versions requiring PHP >=8.4.1, so `composer install` (with
          # dev deps) only resolves on 8.4+. Production installs are
          # unaffected (they use `composer install --no-dev`, skipping these
          # packages entirely) — see INSTALL.md. Track whichever PHP version
          # composer.lock's dev deps actually require until that mismatch is
          # resolved.
          php-version: "8.4"
          extensions: pdo_mysql, curl, mbstring, openssl, gd, zip, maxminddb
          coverage: none
          tools: composer:v2

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Lint (PSR-12)
        run: composer cs

      - name: Static analysis (PHPStan)
        run: composer stan

      - name: Unit tests (PHPUnit)
        run: composer test
